<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings · WhatsApp Blaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen">
    <header class="border-b border-slate-800 px-8 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-emerald-500/20 grid place-items-center">
          <span class="text-emerald-400 text-lg">⚡</span>
        </div>
        <div>
          <h1 class="text-lg font-semibold">Settings</h1>
          <p class="text-xs text-slate-400">Fonnte API keys & anti-ban</p>
        </div>
      </div>
      <nav class="flex gap-3 text-sm">
        <a href="index.html" class="px-3 py-1.5 rounded hover:bg-slate-800 text-slate-300">Dashboard</a>
        <a href="settings.html" class="px-3 py-1.5 rounded bg-slate-800 text-slate-100">Settings</a>
      </nav>
    </header>

    <main class="px-8 py-6 max-w-3xl space-y-6">
      <section class="rounded-xl bg-slate-800/60 p-5 border border-slate-700 space-y-4">
        <h2 class="font-semibold">Fonnte API keys</h2>
        <p class="text-xs text-slate-400">
          Add one key per line. The blaster picks a key per message according to the mode below.
        </p>
        <textarea
          id="api-keys"
          rows="6"
          class="w-full rounded-lg bg-slate-900 border border-slate-700 p-3 text-sm font-mono"
          placeholder="key-1&#10;key-2"
        ></textarea>
        <div>
          <label class="text-xs text-slate-400">Account mode</label>
          <select
            id="account-mode"
            class="mt-1 block rounded-lg bg-slate-900 border border-slate-700 p-2 text-sm"
          >
            <option value="round_robin">Round-robin (load balance)</option>
            <option value="single">Single (always first key)</option>
          </select>
        </div>
      </section>

      <section class="rounded-xl bg-slate-800/60 p-5 border border-slate-700 space-y-4">
        <h2 class="font-semibold">Anti-ban</h2>
        <div class="grid grid-cols-2 gap-3">
          <label class="text-sm space-y-1">
            <span class="text-xs text-slate-400">Min delay (sec)</span>
            <input
              id="min-delay"
              type="number"
              min="0"
              class="w-full rounded-lg bg-slate-900 border border-slate-700 p-2 text-sm"
            />
          </label>
          <label class="text-sm space-y-1">
            <span class="text-xs text-slate-400">Max delay (sec)</span>
            <input
              id="max-delay"
              type="number"
              min="0"
              class="w-full rounded-lg bg-slate-900 border border-slate-700 p-2 text-sm"
            />
          </label>
          <label class="text-sm space-y-1">
            <span class="text-xs text-slate-400">Batch size</span>
            <input
              id="batch-size"
              type="number"
              min="1"
              class="w-full rounded-lg bg-slate-900 border border-slate-700 p-2 text-sm"
            />
          </label>
          <label class="text-sm space-y-1">
            <span class="text-xs text-slate-400">Batch pause (sec)</span>
            <input
              id="batch-pause"
              type="number"
              min="0"
              class="w-full rounded-lg bg-slate-900 border border-slate-700 p-2 text-sm"
            />
          </label>
        </div>
      </section>

      <div class="flex items-center gap-3">
        <button
          id="btn-save"
          class="rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-semibold px-5 py-2"
        >
          Save settings
        </button>
        <span id="save-status" class="text-xs text-slate-400"></span>
      </div>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
