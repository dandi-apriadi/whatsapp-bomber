[package]
name = "whatsapp-bomber"
version = "0.1.0"
edition = "2021"
description = "Desktop WhatsApp blaster (Fonnte) — Rust + Tauri 2 + SQLite"
license = "MIT"
repository = "https://github.com/dandi-apriadi/whatsapp-bomber"

# Library + binary in the same crate so Tauri's mobile entrypoint can call into it.
[lib]
name = "whatsapp_bomber_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "whatsapp-bomber"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri ---
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# --- Async / runtime ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
async-trait = "0.1"

# --- HTTP client (Fonnte) ---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

# --- HTTP server (Fonnte webhook) ---
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "form", "query", "tower-log"] }
tower = "0.5"

# --- Database ---
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "migrate", "chrono"] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Time ---
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# --- File parsing ---
csv = "1.3"
calamine = "0.26"

# --- Misc ---
thiserror = "1"
anyhow = "1"
rand = "0.8"
parking_lot = "0.12"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[features]
# Default Tauri features for desktop targets.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
